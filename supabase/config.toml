# AbundanceAI — local Supabase config.
# `supabase start` boots Postgres + Auth + Storage + Edge runtime from this.
project_id = "abundance-ai"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5173/welcome"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions.checkout-session]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.content-upload-url]
verify_jwt = true

[functions.program-build]
verify_jwt = true

[functions.program-update]
verify_jwt = true

[functions.program-activate]
verify_jwt = true

[functions.program-public]
verify_jwt = false

[functions.enroll-session]
verify_jwt = false

[functions.enroll]
verify_jwt = false

[functions.marketing-generate]
verify_jwt = true

[functions.marketing-update]
verify_jwt = true

[functions.sessions-set-link]
verify_jwt = true

[functions.stripe-connect]
verify_jwt = true

[functions.mindset-checkin]
verify_jwt = true

[functions.mindset-chat]
verify_jwt = true

[functions.mindset-reflect]
verify_jwt = true

[functions.circle-get]
verify_jwt = true

[functions.testimonial-create]
verify_jwt = true

[functions.refund-request]
verify_jwt = true

[functions.journey-update]
verify_jwt = true
